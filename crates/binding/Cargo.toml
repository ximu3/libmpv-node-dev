[package]
name = "libmpv-binding"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-executor = "=0.3.34"
tokio = { version = "=1.54.1", features = ["rt"] }
libmpv-core = { path = "../core" }
napi = { version = "=3.15.0", default-features = false, features = ["napi8", "dyn-symbols", "tokio_rt"] }
napi-derive = "=3.6.13"

[build-dependencies]
napi-build = "=2.6.0"
